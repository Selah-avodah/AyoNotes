<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes of Gratitude</title>
  <meta name="theme-color" content="#170f0e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Nunito:wght@500;700;800&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow">Live in Christ
      </p>
      <h1 id="title">Thankful notes</h1>
      <p id="subtitle" class="subtitle"></p>
    </header>

    <section class="stage" aria-label="Keyboard">
      <div class="synth off" id="synth">
        <div class="cheek" aria-hidden="true"></div>

        <div class="synth-body">
          <div class="panel">
            <div class="panel-left">
              <div class="brand">
                <span class="brand-name" id="brandName">Thankful notes</span>
                <span class="model">Akai Red Midi · modular</span>
              </div>
              <div class="wheels" aria-hidden="true">
                <span class="wheel"><span class="wheel-ridge"></span></span>
                <span class="wheel mod" id="modWheel"><span class="wheel-ridge"></span></span>
              </div>
            </div>

            <div class="lcd" id="lcd" role="status" aria-live="polite">
              <div class="lcd-line" id="lcd1">&nbsp;</div>
              <div class="lcd-line" id="lcd2">&nbsp;</div>
            </div>

            <div class="knobs">
              <div class="knob-wrap">
                <button class="knob" id="knobVol" type="button" aria-label="Volume"><span class="knob-cap"></span></button>
                <span class="knob-label">Vol</span>
              </div>
              <div class="knob-wrap">
                <button class="knob" id="knobTone" type="button" aria-label="Sound"><span class="knob-cap"></span></button>
                <span class="knob-label">Tone</span>
              </div>
              <div class="knob-wrap">
                <button class="knob" id="knobVerb" type="button" aria-label="Echo"><span class="knob-cap"></span></button>
                <span class="knob-label">Echo</span>
              </div>
            </div>

            <div class="controls">
              <button class="pbtn power" id="powerBtn" type="button" aria-pressed="false"><span class="led"></span>Power</button>
              <div class="oct">
                <button class="pbtn small" id="octDown" type="button" aria-label="Scroll keyboard left">Oct −</button>
                <button class="pbtn small" id="octUp" type="button" aria-label="Scroll keyboard right">Oct +</button>
              </div>
              <button class="pbtn accent" id="randomBtn" type="button">▶ Play a random note</button>
              <button class="pbtn" id="addBtn" type="button" hidden>+ Add a note</button>
            </div>
          </div>

          <div class="keybed-wrap" id="keybedWrap">
            <div class="keybed" id="keybed" role="group" aria-label="Notes from friends"></div>
          </div>
        </div>

        <div class="cheek" aria-hidden="true"></div>
      </div>

      <p class="status" id="status">Press any key to read a note</p>
    </section>
  </main>

  <div class="fx" id="fx" aria-hidden="true"></div>

  <!-- Reading a note -->
  <dialog class="sheet-dialog" id="noteDialog" aria-labelledby="noteFrom">
    <article class="sheet">
      <button class="icon-btn" data-close type="button" aria-label="Close">&times;</button>
      <p class="sheet-key" id="noteKey"></p>
      <h2 class="sheet-from" id="noteFrom"></h2>
      <div class="sheet-body" id="noteBody"></div>
      <p class="sheet-date" id="noteDate"></p>
      <nav class="sheet-nav">
        <button class="btn ghost" id="prevNote" type="button">&larr; Previous</button>
        <span id="notePos"></span>
        <button class="btn ghost" id="nextNote" type="button">Next &rarr;</button>
      </nav>
    </article>
  </dialog>

  <!-- Leaving a note -->
  <dialog class="sheet-dialog" id="addDialog" aria-labelledby="addTitle">
    <div class="sheet" id="addRoot">
      <button class="icon-btn" data-close type="button" aria-label="Close">&times;</button>

      <form data-f="form" novalidate>
        <h2 class="sheet-from" id="addTitle">Leave a note</h2>
        <p class="form-intro">Write a message, add a photo of a handwritten note, or both for Labi. It'll get its own key on the keyboard.</p>

        <label class="field"><span>Yer name</span>
          <input data-f="name" type="text" maxlength="60" autocomplete="name" required />
        </label>
        <label class="field"><span>Yer message</span>
          <textarea data-f="msg" maxlength="2000" rows="5" placeholder="Write something kind…"></textarea>
        </label>
        <div class="field"><span>Foto <em>(optional)</em></span>
          <label class="photo-pick" data-f="pick"><input data-f="photo" type="file" accept="image/*" /><span>📷 Choose a foto</span></label>
          <div class="photo-preview" data-f="preview" hidden>
            <img data-f="previewImg" alt="Selected photo" />
            <button class="btn ghost" data-f="remove" type="button">Remove foto</button>
          </div>
        </div>
        <p class="form-error" data-f="error" role="alert"></p>
        <button class="btn submit" data-f="submit" type="submit">Add my note to the keyboard</button>
      </form>

      <div class="done" data-f="done" hidden>
        <div class="done-quaver"><svg viewBox="0 0 24 32" aria-hidden="true"><use href="#quaver"/></svg></div>
        <h2 class="sheet-from">Your note is on the keyboard!</h2>
        <p data-f="doneMsg"></p>
        <div class="done-actions">
          <button class="btn ghost" data-f="another" type="button">Add another</button>
          <button class="btn" id="seeKeys" type="button">See the keyboard</button>
        </div>
      </div>
    </div>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="quaver" viewBox="0 0 24 32">
      <ellipse cx="8.2" cy="25.2" rx="6.6" ry="4.7" transform="rotate(-22 8.2 25.2)"/>
      <rect x="12.9" y="2.5" width="2.5" height="23" rx="1.1"/>
      <path d="M15.2 2.5c.3 4.6 3.9 6.1 5.6 9.2 1.6 2.9.9 6.6-.9 8.6 1-3.6-.4-6.3-4.7-8.1z"/>
    </symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="notes.js"></script>
  <script src="sound.js"></script>
  <script src="form.js"></script>
  <script src="app.js"></script>
</body>
</html>
