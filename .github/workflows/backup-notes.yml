name: Back up Jar of Notes

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency: backup-notes

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2

      - name: Copy notes and photos from Supabase
        run: node scripts/backup-notes.js

      - name: Save the backup if anything changed
        run: |
          git add backup
          if git diff --cached --quiet; then
            echo "No new notes."
            exit 0
          fi
          # Commit as the repo owner so Vercel's free plan will deploy it
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git commit -m "Back up Jar of Notes"
          git push
